<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef4fb">
<title>Trazo Azul</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eef4fb;--card:#fff;--ink:#0f1f3a;--mut:#5b6b82;--line:#d9e4f2;--moss:#0f4c81;--ball:#f4c430;--coral:#d9472f;--coralbg:#fde8e4;--mintbg:#dbeafe;--hero:linear-gradient(135deg,#0f4c81,#1d4ed8);--fs:15px}
:root.dark{--bg:#0b1220;--card:#131d33;--ink:#eaf1fb;--mut:#93a4bf;--line:#22304d;--moss:#60a5fa;--coral:#ff8a74;--coralbg:#3a1f1a;--mintbg:#172a52}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{font:600 var(--fs)/1.4 'Nunito',sans-serif;background:var(--bg);color:var(--ink);max-width:480px;margin:0 auto;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));min-height:100dvh}
body.big{--fs:17px}
button,a,label{touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;transition:transform .12s,background .15s}
button:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
input,select,textarea{font:700 16px 'Nunito',sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--moss)}
textarea{resize:vertical;min-height:84px}
h1,h2,.num{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 6px}
.top h1{font-size:24px;font-weight:800;color:var(--moss);letter-spacing:.04em}
.mes{order:3;width:100%;justify-content:space-between;display:flex;align-items:center;gap:2px;background:var(--card);border-radius:99px;padding:2px;border:1px solid var(--line)}
.mes button{width:40px;height:40px;border-radius:99px;font-size:16px}
.mes span{flex:1;text-align:center;font-weight:800;font-size:13px}
.gear{width:44px;height:44px;border-radius:99px;font-size:20px}
.scr{display:none;padding:10px 16px}
.scr.on{display:block;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.card h2{font-size:17px;font-weight:800;margin-bottom:10px}
.hero{background:var(--hero);color:#fff;border-radius:28px;padding:20px;display:flex;gap:18px;align-items:center;margin-bottom:14px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.16)}
.ring .fg{stroke:var(--ball);transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 28px 'Bricolage Grotesque'}
.hero small{opacity:.75;font-size:12px;display:block}
.hero .big{font:800 30px/1.1 'Bricolage Grotesque';margin:2px 0 8px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800;background:rgba(255,255,255,.16)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.duo>div{border-radius:20px;padding:14px;background:var(--card);border:1px solid var(--line)}
.duo .v{font:800 22px 'Bricolage Grotesque'}.duo small{color:var(--mut);font-size:12px}
.duo .r{background:var(--coralbg);border-color:transparent}.duo .r .v{color:var(--coral)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:800 17px 'Bricolage Grotesque';flex:none}
.grow{flex:1;min-width:0}.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow small{color:var(--mut);font-size:12.5px}
.amt{font:800 16px 'Bricolage Grotesque'}
.st{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:800;min-height:34px}
.st.pagado{background:var(--mintbg);color:var(--moss)}.st.pendiente{background:var(--coralbg);color:var(--coral)}
.ib{width:44px;height:44px;border-radius:14px;font-size:17px;color:var(--mut)}
.wa{background:var(--mintbg);color:var(--moss);border-radius:99px;padding:9px 14px;font-size:13px;font-weight:800;min-height:40px}
.seg{display:flex;background:var(--line);border-radius:14px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:800;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.btn{width:100%;padding:14px;border-radius:16px;font-weight:800;font-size:16px;background:var(--moss);color:#fff}
.dark .btn{color:#0b1220}
.btn.ghost{background:var(--mintbg);color:var(--moss)}.btn.red{background:var(--coralbg);color:var(--coral)}
.stack{display:grid;gap:10px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:18px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut);font-weight:800;gap:4px}
.bars i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--moss);opacity:.35;min-height:4px;transition:height .6s}
.bars .now i{opacity:1;background:var(--ball)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}.empty b{display:block;font-size:30px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:flex;justify-content:space-around;align-items:center;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--mut);padding:6px 0;min-height:52px}
.nav .t.on{color:var(--moss)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{width:60px;height:60px;border-radius:50%;background:var(--ball);color:#0f1f3a;font:800 32px/1 'Bricolage Grotesque';margin-top:-30px;box-shadow:0 8px 20px rgba(244,196,48,.45);flex:none}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,20,16,.5);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet>div{background:var(--bg);width:min(100%,480px);max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:9px 14px;font-weight:800;font-size:13px;min-height:40px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-size:14px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:60;display:flex;gap:14px;align-items:center;max-width:92%}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--ball);font-weight:800;min-height:32px}
.hor{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}
.hg{display:grid;grid-template-columns:46px repeat(7,minmax(84px,1fr));min-width:700px}
.hg>*{border:.5px solid var(--line);padding:4px;font-size:12px}
.hg .h{background:var(--moss);color:#fff;text-align:center;font-weight:800;padding:8px 2px}
.dark .hg .h{color:#0b1220}
.hg .tm{color:var(--mut);display:grid;place-items:center;font-weight:800}
.hg textarea{border:0;min-height:44px;padding:4px;font-size:16px;background:transparent;border-radius:0}
.chk{display:flex;align-items:center;gap:12px;padding:6px 0}
.chk input{width:22px;height:22px;accent-color:var(--moss)}
.chk.d span{text-decoration:line-through;color:var(--mut)}
.set{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><h1>TRAZO AZUL</h1>
<div class="mes"><button onclick="mv(-1)" aria-label="Mes anterior">◀</button><span id="mes"></span><button onclick="mv(1)" aria-label="Mes siguiente">▶</button></div>
<button class="gear" onclick="go('aj')" aria-label="Ajustes">⚙️</button></div>

<section class="scr on" id="s-in"></section>
<section class="scr" id="s-pa">
 <div class="seg" id="flt"></div>
 <input id="q" type="search" placeholder="Buscar perrito…" oninput="rPa()" style="margin-bottom:12px">
 <div class="card" id="lp" style="padding:6px 16px"></div>
</section>
<section class="scr" id="s-ag">
 <div class="seg"><button id="ag-h" class="on" onclick="ag('h')">Horario</button><button id="ag-t" onclick="ag('t')">Tareas</button></div>
 <div id="a-h"><div class="hor"><div class="hg" id="hg"></div></div><p style="color:var(--mut);font-size:12.5px;margin-top:8px">Se guarda solo mientras escribes.</p></div>
 <div id="a-t" style="display:none"><div class="card"><div class="stack"><select id="td"></select><input id="tt" placeholder="¿Qué hay que hacer?" enterkeyhint="done"><button class="btn" onclick="addT()">Agregar tarea</button></div></div><div class="card" id="lt"></div></div>
</section>
<section class="scr" id="s-cl"><div id="lc"></div></section>
<section class="scr" id="s-aj">
 <div class="card"><h2>Apariencia</h2>
  <div class="set"><span>Modo oscuro</span><input type="checkbox" id="dk" onchange="dark(this.checked)" style="width:24px;height:24px;accent-color:var(--moss)"></div>
  <div class="set"><span>Letra grande</span><input type="checkbox" id="fz" onchange="fz(this.checked)" style="width:24px;height:24px;accent-color:var(--moss)"></div></div>
 <div class="card"><h2>Tus datos</h2><div class="stack">
  <button class="btn ghost" onclick="xls()">Exportar el mes a Excel</button>
  <button class="btn ghost" onclick="bk()">Descargar respaldo (.json)</button>
  <label class="btn red" style="display:block;text-align:center;cursor:pointer">Restaurar respaldo<input type="file" accept=".json" hidden onchange="rs(event)"></label>
  <p style="color:var(--mut);font-size:12.5px">Los datos viven solo en este teléfono. Descarga un respaldo cada semana.</p></div></div>
</section>

<nav class="nav" aria-label="Principal">
 <button class="t on" data-s="in" onclick="go('in')"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
 <button class="t" data-s="pa" onclick="go('pa')"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Paseos</button>
 <button class="fab" onclick="op()" aria-label="Registrar paseo">+</button>
 <button class="t" data-s="ag" onclick="go('ag')"><svg viewBox="0 0 24 24"><path d="M3 5h18v16H3zM3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
 <button class="t" data-s="cl" onclick="go('cl')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Clientes</button>
</nav>

<div class="sheet" id="sh" onclick="if(event.target===this)cl()"><div>
 <h2 style="font-size:22px;margin-bottom:12px">Nuevo paseo</h2>
 <div class="stack">
  <div class="chips" id="ch"></div>
  <input id="rn" placeholder="Nombre del perrito" list="dl" autocomplete="off"><datalist id="dl"></datalist>
  <input id="rv" type="text" inputmode="numeric" placeholder="Valor ($)">
  <input id="rf" type="date">
  <div class="seg" style="margin:0"><button id="e-pagado" class="on" onclick="est('pagado')">Pagado</button><button id="e-pendiente" onclick="est('pendiente')">Pendiente</button></div>
  <input id="rt" placeholder="Nota (opcional)" enterkeyhint="done">
  <button class="btn" onclick="addP()">Guardar paseo</button>
 </div></div></div>
<div class="toast" id="to"><span></span><button></button></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('No se pudo guardar. ¿Almacenamiento lleno?')}};
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const HORAS=['6am','7am','8am','9am','10am','11am','12pm','1pm','2pm','3pm','4pm','5pm','6pm','7pm'];
const cop=n=>'$'+(+n||0).toLocaleString('es-CO');
const mk=(y,m)=>y+'-'+String(m+1).padStart(2,'0');
const now=new Date();let cur={y:now.getFullYear(),m:now.getMonth()};
const K=()=>mk(cur.y,cur.m);
const pas=k=>rd('esposita_paseos_'+k,[]).map(p=>({...p,estado:p.estado||'pagado'}));
const setPas=(k,a)=>wr('esposita_paseos_'+k,a);
const cli=()=>rd('esposita_clientes',{});
const hoyISO=()=>new Date(now.getTime()-now.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const hue=n=>[...n].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const av=n=>`<div class="av" style="background:hsl(${hue(n)} 60% 50%/.2)">${esc(n.trim()[0]||'?').toUpperCase()}</div>`;
let flt='todos',stt='pagado',tm;

function toast(msg,label,fn){const t=$('to');t.firstChild.textContent=msg;const b=t.lastChild;b.style.display=label?'':'none';b.textContent=label||'';b.onclick=()=>{fn&&fn();t.classList.remove('on')};t.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),label?5000:2800)}
function go(s){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==='s-'+s));document.querySelectorAll('.nav .t').forEach(b=>b.classList.toggle('on',b.dataset.s===s));scrollTo(0,0)}
function mv(d){cur=new Date(cur.y,cur.m+d,1);cur={y:cur.getFullYear(),m:cur.getMonth()};R()}
function dark(on){document.documentElement.classList.toggle('dark',on);localStorage.setItem('esposita_darkmode',on);document.querySelector('meta[name=theme-color]').content=on?'#0b1220':'#eef4fb'}
function fz(on){document.body.classList.toggle('big',on);localStorage.setItem('esposita_fontsize',on?'large':'normal')}

function R(){$('mes').textContent=MES[cur.m]+' '+cur.y;rIn();rPa();rHor();rT();rCl()}

function pend(P){const o={};P.filter(p=>p.estado==='pendiente').forEach(p=>o[p.nombre]=(o[p.nombre]||0)+p.valor);return o}
function rIn(){
 const P=pas(K()),meta=rd('esposita_meta_'+K(),0);
 const cob=P.filter(p=>p.estado!=='pendiente').reduce((s,p)=>s+p.valor,0),por=P.reduce((s,p)=>p.estado==='pendiente'?s+p.valor:s,0);
 const pct=meta>0?Math.min(100,Math.round(cob/meta*100)):0,C=2*Math.PI*52;
 const h=now.getHours(),sal=h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';
 const di=(now.getDay()+6)%7,dn=DIAS[di],hor=rd('esposita_horario',{});
 const hoy=HORAS.filter(x=>hor[dn+'_'+x]).map(x=>`<div class="row"><b style="width:44px;color:var(--moss)">${x}</b><span class="grow">${esc(hor[dn+'_'+x])}</span></div>`);
 rd('esposita_tareas',[]).filter(t=>t.dia===dn&&!t.done).forEach(t=>hoy.push(`<div class="row"><b style="width:44px">✅</b><span class="grow">${esc(t.texto)}</span></div>`));
 const deb=Object.entries(pend(P)).sort((a,b)=>b[1]-a[1]);
 const bars=[];for(let i=5;i>=0;i--){const d=new Date(cur.y,cur.m-i,1),k=mk(d.getFullYear(),d.getMonth());bars.push({k,l:MES[d.getMonth()].slice(0,3),v:pas(k).reduce((s,p)=>p.estado!=='pendiente'?s+p.valor:s,0),n:i===0})}
 const mx=Math.max(...bars.map(b=>b.v),1);
 $('s-in').innerHTML=`
 <p style="margin:2px 4px 12px;color:var(--mut)">${sal} 👋 Hoy es ${dn.toLowerCase()}.</p>
 <div class="hero"><div class="ring"><svg width="128" height="128"><circle class="bg" cx="64" cy="64" r="52"/><circle class="fg" cx="64" cy="64" r="52" stroke-dasharray="${C}" stroke-dashoffset="${C}" id="rg"/></svg><b>${pct}%</b></div>
 <div><small>Cobrado este mes</small><div class="big">${cop(cob)}</div>
 <span class="pill">${meta?(cob>=meta?'¡Meta lograda! 🎉':'Faltan '+cop(meta-cob)):'Sin meta aún'}</span></div></div>
 <div class="duo"><div class="r"><div class="v">${cop(por)}</div><small>Por cobrar</small></div><div><div class="v">${P.length}</div><small>Paseos del mes</small></div></div>
 ${deb.length?`<div class="card"><h2>Quién te debe</h2>${deb.map(([n,v])=>`<div class="row">${av(n)}<div class="grow"><b>${esc(n)}</b><small>${cop(v)}</small></div><button class="wa" data-n="${esc(n)}" onclick="cobrar(this.dataset.n)">Cobrar</button></div>`).join('')}</div>`:''}
 <div class="card"><h2>Hoy</h2>${hoy.length?hoy.join(''):'<div class="empty">Nada programado. Día libre 🌤️</div>'}</div>
 <div class="card"><h2>Últimos 6 meses</h2><div class="bars">${bars.map(b=>`<div class="${b.n?'now':''}">${b.v?Math.round(b.v/1000)+'k':''}<i style="height:${Math.max(4,b.v/mx*82)}px"></i>${b.l}</div>`).join('')}</div></div>
 <div class="card"><h2>Meta del mes</h2><div style="display:flex;gap:8px"><input id="mi" type="text" inputmode="numeric" placeholder="$ Meta" value="${meta||''}"><button class="btn" style="width:auto;padding:0 20px" onclick="saveMeta()">Guardar</button></div></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const r=$('rg');if(r)r.style.strokeDashoffset=C*(1-pct/100)}));
}
function saveMeta(){const v=parseFloat($('mi').value.replace(/\D/g,''));if(!v)return toast('Pon una meta válida');wr('esposita_meta_'+K(),v);R();toast('Meta guardada 🎯')}

function rPa(){
 $('flt').innerHTML=['todos','pendiente','pagado'].map(f=>`<button class="${flt===f?'on':''}" onclick="flt='${f}';rPa()">${{todos:'Todos',pendiente:'Pendientes',pagado:'Pagados'}[f]}</button>`).join('');
 const q=($('q').value||'').toLowerCase();
 const L=pas(K()).filter(p=>(flt==='todos'||p.estado===flt)&&p.nombre.toLowerCase().includes(q)).sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.id-a.id);
 $('lp').innerHTML=L.length?L.map(p=>{const f=new Date(p.fecha+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});
  return `<div class="row">${av(p.nombre)}<div class="grow"><b>${esc(p.nombre)}</b><small>${f}${p.nota?' · '+esc(p.nota):''}</small></div><div style="text-align:right"><div class="amt">${cop(p.valor)}</div><button class="st ${p.estado}" onclick="tog(${p.id})" aria-label="Cambiar estado">${p.estado==='pagado'?'Pagado':'Pendiente'}</button></div>
  <div style="display:flex"><button class="ib" onclick="dup(${p.id})" aria-label="Repetir paseo">🔁</button><button class="ib" onclick="del(${p.id})" aria-label="Borrar paseo">🗑️</button></div></div>`}).join(''):'<div class="empty"><b>🐕</b>No hay paseos así en este mes.<br>Toca + para registrar el primero.</div>';
}
function tog(id){const k=K(),a=pas(k),p=a.find(x=>x.id===id);if(p){p.estado=p.estado==='pagado'?'pendiente':'pagado';setPas(k,a);R()}}
function del(id){const k=K(),a=pas(k),p=a.find(x=>x.id===id);if(!p)return;setPas(k,a.filter(x=>x.id!==id));R();toast('Paseo borrado','Deshacer',()=>{setPas(k,[...pas(k),p]);R()})}
function dup(id){const p=pas(K()).find(x=>x.id===id);if(p){op();$('rn').value=p.nombre;$('rv').value=p.valor;$('rt').value=p.nota||''}}

function op(){const C=cli(),cnt={};Object.keys(pas(K())).length;Object.keys(C).forEach(n=>cnt[n]=0);pas(K()).forEach(p=>cnt[p.nombre]=(cnt[p.nombre]||0)+1);
 const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,8);
 $('ch').innerHTML=top.map(n=>`<button data-n="${esc(n)}" onclick="pick(this.dataset.n)">${esc(n)}</button>`).join('');
 $('dl').innerHTML=Object.keys(C).map(n=>`<option value="${esc(n)}">`).join('');
 $('rn').value='';$('rv').value='';$('rt').value='';$('rf').value=hoyISO();est('pagado');$('sh').classList.add('on')}
function cl(){$('sh').classList.remove('on')}
function pick(n){$('rn').value=n;const t=cli()[n]?.tarifa;if(t)$('rv').value=t;$('rv').focus()}
function est(s){stt=s;['pagado','pendiente'].forEach(x=>$('e-'+x).classList.toggle('on',x===s))}
function addP(){
 const nombre=$('rn').value.trim().replace(/\s+/g,' '),valor=parseFloat($('rv').value.replace(/\D/g,'')),fecha=$('rf').value;
 if(!nombre||!valor||!fecha)return toast('Falta nombre, valor o fecha');
 const key=fecha.slice(0,7),a=pas(key);a.push({id:Date.now(),nombre,valor,fecha,nota:$('rt').value.trim(),estado:stt});setPas(key,a);
 const C=cli(),ex=Object.keys(C).find(n=>n.toLowerCase()===nombre.toLowerCase());
 if(!ex){C[nombre]={notas:'',tel:'',tarifa:valor}}else if(!C[ex].tarifa)C[ex].tarifa=valor;
 wr('esposita_clientes',C);cl();R();toast(key===K()?'Paseo guardado 🐾':'Guardado en '+MES[+key.slice(5)-1])}

function rCl(){const C=cli(),P=pend(pas(K())),ns=Object.keys(C).sort((a,b)=>a.localeCompare(b));
 $('lc').innerHTML=ns.length?ns.map(n=>`<div class="card"><div class="row" style="border:0;padding-top:0">${av(n)}<div class="grow"><b>${esc(n)}</b><small>${P[n]?'Debe '+cop(P[n]):'Al día ✓'}</small></div>${P[n]?`<button class="wa" data-n="${esc(n)}" onclick="cobrar(this.dataset.n)">Cobrar</button>`:''}</div>
 <div class="stack" data-n="${esc(n)}"><input data-f="tel" inputmode="tel" placeholder="WhatsApp del dueño" value="${esc(C[n].tel)}"><input data-f="tarifa" inputmode="numeric" placeholder="Tarifa por paseo" value="${esc(C[n].tarifa||'')}"><textarea data-f="notas" placeholder="Alergias, llaves, mañas…">${esc(C[n].notas)}</textarea>
 <button class="btn red" data-n="${esc(n)}" onclick="delC(this.dataset.n)" style="padding:10px;font-size:14px">Quitar cliente</button></div></div>`).join(''):'<div class="empty"><b>🐶</b>Aquí aparecen tus perritos cuando registres el primer paseo.</div>'}
function delC(n){if(!confirm('¿Quitar a '+n+'? Sus paseos no se borran.'))return;const C=cli();delete C[n];wr('esposita_clientes',C);rCl()}
function cobrar(n){const C=cli(),tel=String(C[n]?.tel||'').replace(/\D/g,''),L=pas(K()).filter(p=>p.nombre===n&&p.estado==='pendiente').sort((a,b)=>a.fecha.localeCompare(b.fecha));
 const tot=L.reduce((s,p)=>s+p.valor,0),f=p=>new Date(p.fecha+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});
 const m=`Hola, te hablamos de Trazo Azul 🐾 Te paso el detalle de los paseos de ${n} que están pendientes de pago:\n${L.map(p=>'• '+f(p)+': '+cop(p.valor)).join('\n')}\nTotal: ${cop(tot)}. ¡Gracias!`;
 open('https://wa.me/'+(tel.length===10?'57'+tel:tel)+'?text='+encodeURIComponent(m),'_blank')}

function ag(t){['h','t'].forEach(x=>{$('ag-'+x).classList.toggle('on',x===t);$('a-'+x).style.display=x===t?'':'none'})}
function rHor(){const h=rd('esposita_horario',{});let s='<div class="h"></div>'+DIAS.map(d=>`<div class="h">${d.slice(0,3)}</div>`).join('');
 HORAS.forEach(x=>{s+=`<div class="tm">${x}</div>`+DIAS.map(d=>`<div><textarea data-k="${d}_${x}" aria-label="${d} ${x}">${esc(h[d+'_'+x])}</textarea></div>`).join('')});$('hg').innerHTML=s}
let ht;document.addEventListener('input',e=>{const k=e.target.dataset;if(k.k){clearTimeout(ht);ht=setTimeout(()=>{const h=rd('esposita_horario',{});if(e.target.value.trim())h[k.k]=e.target.value;else delete h[k.k];wr('esposita_horario',h)},400)}
 if(k.f){const n=e.target.closest('[data-n]').dataset.n,C=cli();if(C[n]){C[n][k.f]=e.target.value;wr('esposita_clientes',C)}}});
function rT(){$('td').innerHTML=DIAS.map(d=>`<option ${d===DIAS[(now.getDay()+6)%7]?'selected':''}>${d}</option>`).join('');
 const T=rd('esposita_tareas',[]);$('lt').innerHTML=T.length?DIAS.map(d=>{const L=T.filter(t=>t.dia===d);return L.length?`<div style="color:var(--mut);font-size:12.5px;margin:10px 0 2px">${d}</div>`+L.map(t=>`<div class="chk ${t.done?'d':''}"><input type="checkbox" ${t.done?'checked':''} onchange="chkT(${t.id})"><span class="grow">${esc(t.texto)}</span><button class="ib" onclick="delT(${t.id})" aria-label="Borrar tarea">✕</button></div>`).join(''):''}).join(''):'<div class="empty"><b>✨</b>Sin tareas por ahora.</div>'}
function addT(){const x=$('tt').value.trim();if(!x)return toast('Escribe la tarea');const T=rd('esposita_tareas',[]);T.push({id:Date.now(),dia:$('td').value,texto:x,done:false});wr('esposita_tareas',T);$('tt').value='';rT();rIn()}
function chkT(id){const T=rd('esposita_tareas',[]),t=T.find(x=>x.id===id);if(t){t.done=!t.done;wr('esposita_tareas',T);rT();rIn()}}
function delT(id){wr('esposita_tareas',rd('esposita_tareas',[]).filter(x=>x.id!==id));rT();rIn()}

function xls(){const P=pas(K());if(!P.length)return toast('No hay paseos este mes');
 const cob=P.filter(p=>p.estado!=='pendiente').reduce((s,p)=>s+p.valor,0),por=P.reduce((s,p)=>p.estado==='pendiente'?s+p.valor:s,0);
 const d=[['Fecha','Perrito','Valor','Estado','Nota'],...P.sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(p=>[p.fecha,p.nombre,p.valor,p.estado,p.nota||''])];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Resumen',K()],['Cobrado',cob],['Por cobrar',por],['Meta',rd('esposita_meta_'+K(),0)]]),'Resumen');
 const w=XLSX.utils.aoa_to_sheet(d);w['!cols']=[{wch:12},{wch:20},{wch:12},{wch:12},{wch:30}];XLSX.utils.book_append_sheet(wb,w,'Paseos');XLSX.writeFile(wb,'Paseos_TrazoAzul_'+K()+'.xlsx')}
function bk(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('esposita_'))o[k]=localStorage.getItem(k)}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='Respaldo_TrazoAzul_'+hoyISO()+'.json';a.click();toast('Respaldo descargado')}
function rs(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;
 const ks=Object.keys(o).filter(k=>k.startsWith('esposita_')&&typeof o[k]==='string');if(!ks.length)throw 0;ks.forEach(k=>{if(!/darkmode|fontsize/.test(k))JSON.parse(o[k])});
 if(!confirm('Esto reemplaza todos los datos de este teléfono por los del archivo. ¿Seguir?'))return;
 Object.keys(localStorage).filter(k=>k.startsWith('esposita_')).forEach(k=>localStorage.removeItem(k));ks.forEach(k=>localStorage.setItem(k,o[k]));location.reload()}catch{toast('Ese archivo no es un respaldo válido')}};r.readAsText(f)}

(()=>{const sd=localStorage.getItem('esposita_darkmode'),d=sd===null?matchMedia('(prefers-color-scheme:dark)').matches:sd==='true',l=localStorage.getItem('esposita_fontsize')==='large';
 $('dk').checked=d;dark(d);$('fz').checked=l;fz(l);R()})();
</script>
