<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f2f5fa;--card:#fff;--ink:#0b2545;--mut:#5f6f86;--line:#e1e8f2;--moss:#0f4c81;--ball:#7fb6ff;--coral:#b45309;--coralbg:#fef3e2;--mintbg:#e6effa;--hero:linear-gradient(135deg,#0b2545 0%,#0f4c81 58%,#1d4ed8 130%);--fs:15px;--sh:0 1px 2px rgba(11,37,69,.05),0 12px 30px -16px rgba(11,37,69,.22);--grad:linear-gradient(135deg,#0f4c81,#1d4ed8)}
:root.dark{--bg:#060d1a;--card:#111b30;--ink:#e8eefa;--mut:#8fa1bd;--line:#1f2d49;--moss:#6db0ff;--coral:#fbbf6a;--coralbg:#3a2a12;--mintbg:#16294d;--sh:none}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{font:500 var(--fs)/1.5 var(--sys);background:var(--bg);color:var(--ink);max-width:480px;margin:0 auto;padding:0 0 calc(96px + env(safe-area-inset-bottom));min-height:100dvh;font-variant-numeric:tabular-nums}
body.big{--fs:17px}
button,a,label{touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;transition:transform .12s,background .15s,opacity .15s}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
input,select,textarea{font:500 16px var(--sys);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1d4ed8;box-shadow:0 0 0 3px rgba(29,78,216,.16)}
textarea{resize:vertical;min-height:84px}
h1,h2,.num{font-family:var(--sys)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;background:linear-gradient(135deg,#0b2545,#0f4c81);color:#fff}
.brand{display:flex;gap:12px;align-items:center}.logo{height:42px;width:auto;border-radius:10px;flex:none;display:block}
.top h1{font:800 17px/1.1 var(--sys);letter-spacing:.16em;color:#fff}
.top small{display:block;font-size:11.5px;color:rgba(255,255,255,.7);font-weight:500;margin-top:3px}
.gear{width:44px;height:44px;border-radius:12px;color:#fff;background:rgba(255,255,255,.12)}
.gear svg,.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
.mes{display:flex;align-items:center;justify-content:space-between;margin:14px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
.mes button{width:52px;height:46px;color:var(--mut);font-size:22px;line-height:1}
.mes span{flex:1;text-align:center;font:700 15px var(--sys)}
.scr{display:none;padding:6px 16px}
.scr.on{display:block;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.greet{display:flex;flex-direction:column;margin:16px 4px 14px}
.greet b{font:800 24px/1.2 var(--sys);letter-spacing:-.02em}.greet span{color:var(--mut);font-size:13.5px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid var(--line);box-shadow:var(--sh)}
.card h2{font:700 15px var(--sys);margin-bottom:8px;letter-spacing:-.005em}
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:20px;padding:22px;display:flex;gap:18px;align-items:center;margin-bottom:14px;box-shadow:0 20px 40px -22px rgba(11,37,69,.7)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(127,182,255,.28),transparent 70%);pointer-events:none}
.ring{position:relative;width:124px;height:124px;flex:none;z-index:1}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.14)}
.ring .fg{stroke:var(--ball);transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 26px var(--sys)}
.hero>div:last-child{position:relative;z-index:1}
.hero small{opacity:.72;font-size:12.5px;display:block;font-weight:500}
.hero .big{font:800 30px/1.1 var(--sys);letter-spacing:-.02em;margin:3px 0 10px}
.pill{display:inline-block;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.duo>div{border-radius:16px;padding:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.duo .v{font:800 22px var(--sys);letter-spacing:-.02em}.duo small{color:var(--mut);font-size:12.5px}
.duo .r{background:var(--coralbg);border-color:transparent;box-shadow:none}.duo .r .v{color:var(--coral)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 16px var(--sys);flex:none;background:var(--mintbg);color:var(--moss)}
.grow{flex:1;min-width:0}.grow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow small{color:var(--mut);font-size:12.5px}
.amt{font:700 15px var(--sys)}
.st{padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;min-height:32px;margin-top:2px}
.st.pagado{background:var(--mintbg);color:var(--moss)}.st.pendiente{background:var(--coralbg);color:var(--coral)}
.ib{width:44px;height:44px;border-radius:12px;color:var(--mut)}
.wa{background:var(--moss);color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;min-height:40px}
.dark .wa{color:#060d1a}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(11,37,69,.15)}
.btn{width:100%;padding:14px;border-radius:12px;font-weight:600;font-size:15px;background:var(--grad);color:#fff;box-shadow:0 10px 22px -12px rgba(29,78,216,.8)}
.btn.ghost{background:var(--mintbg);color:var(--moss);box-shadow:none}.btn.red{background:var(--coralbg);color:var(--coral);box-shadow:none}
.stack{display:grid;gap:10px}
.bars{display:flex;align-items:flex-end;gap:10px;height:124px;padding-top:18px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut);font-weight:600;gap:5px}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--moss);opacity:.22;min-height:4px;transition:height .6s}
.bars .now i{opacity:1;background:var(--grad)}.bars .now{color:var(--ink)}
.empty{text-align:center;color:var(--mut);padding:28px 10px;font-size:14px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:flex;justify-content:space-around;align-items:center;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);padding:6px 0;min-height:52px}
.nav .t.on{color:var(--moss)}
.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab{width:56px;height:56px;border-radius:18px;background:var(--grad);color:#fff;font:600 30px/1 var(--sys);margin-top:-26px;box-shadow:0 12px 24px -8px rgba(29,78,216,.7);flex:none}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,20,40,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet>div{background:var(--bg);width:min(100%,480px);max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;min-height:40px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#0b2545;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;display:flex;gap:14px;align-items:center;max-width:92%;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#7fb6ff;font-weight:700;min-height:32px}
.hor{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.hg{display:grid;grid-template-columns:46px repeat(7,minmax(84px,1fr));min-width:700px}
.hg>*{border:.5px solid var(--line);padding:4px;font-size:12px}
.hg .h{background:var(--moss);color:#fff;text-align:center;font-weight:600;padding:9px 2px}
.dark .hg .h{color:#060d1a}
.hg .tm{color:var(--mut);display:grid;place-items:center;font-weight:600}
.hg textarea{border:0;min-height:44px;padding:4px;font-size:16px;background:transparent;border-radius:0;box-shadow:none}
.chk{display:flex;align-items:center;gap:12px;padding:6px 0}
.chk input{width:22px;height:22px;accent-color:#1d4ed8}
.chk.d span{text-decoration:line-through;color:var(--mut)}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;--sh:0 0 0 .5px rgba(11,37,69,.07),0 10px 28px -14px rgba(11,37,69,.2)}
:root.dark{--bg:#060d1a;--card:#0f1a2e;--line:#1c2a44;--sh:0 0 0 .5px rgba(255,255,255,.06)}
button:active{transition-duration:.08s}
.top{background:color-mix(in srgb,var(--bg) 68%,transparent);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);color:var(--ink);transition:box-shadow .2s}
.top.s{box-shadow:0 .5px 0 var(--line)}
.top h1{color:var(--moss);letter-spacing:.14em}.top small{color:var(--mut)}
.gear{background:color-mix(in srgb,var(--moss) 11%,transparent);color:var(--moss)}
.card,.duo>div,.mes{border:0;border-radius:20px}
.hero{border-radius:24px}
.card h2{letter-spacing:-.01em}.greet b{letter-spacing:-.025em;line-height:1.1}.hero .big{letter-spacing:-.03em}
.row{border-top:0;position:relative}.row+.row::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--line)}
.nav{background:color-mix(in srgb,var(--card) 60%,transparent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:.5px solid rgba(255,255,255,.55);box-shadow:0 -10px 30px -18px rgba(11,37,69,.25)}
:root.dark .nav{border-top-color:rgba(255,255,255,.1)}
.nav .t{letter-spacing:.01em}
@keyframes in{from{opacity:0}}
.sheet{background:transparent}
.sheet>div{animation:none;will-change:transform;box-shadow:0 -20px 50px -20px rgba(0,0,0,.45)}
.gh{touch-action:none;cursor:grab;margin:-8px -16px 0;padding:8px 16px 0}
.grab{display:block;width:38px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--mut) 45%,transparent);margin:0 auto 14px}
input.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;padding:0;border:0;border-radius:99px;background:color-mix(in srgb,var(--mut) 35%,transparent);position:relative;flex:none;transition:background .25s}
input.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .32s cubic-bezier(.3,1.3,.5,1)}
input.sw:checked{background:#1d4ed8}input.sw:checked::after{transform:translateX(20px)}
@media(prefers-reduced-transparency:reduce){.top,.nav{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media(prefers-contrast:more){.card,.duo>div,.mes{box-shadow:0 0 0 1px var(--ink)}.nav{border-top:1px solid var(--ink)}}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('No se pudo guardar. ¿Almacenamiento lleno?')}};
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

const HORAS=['6am','7am','8am','9am','10am','11am','12pm','1pm','2pm','3pm','4pm','5pm','6pm','7pm'];
const cop=n=>'$'+(+n||0).toLocaleString('es-CO');
const mk=(y,m)=>y+'-'+String(m+1).padStart(2,'0');
const now=new Date();let cur={y:now.getFullYear(),m:now.getMonth()};
const K=()=>mk(cur.y,cur.m);
const pas=k=>rd('esposita_paseos_'+k,[]).map(p=>({...p,estado:p.estado||'pagado'}));

const cli=()=>rd('esposita_clientes',{});
const hoyISO=()=>new Date(now.getTime()-now.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const hue=n=>[...n].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const av=n=>`<div class="av">${esc(n.trim()[0]||'?').toUpperCase()}</div>`;
let flt='todos',stt='pagado',tm;

function go(s){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==='s-'+s));document.querySelectorAll('.nav .t').forEach(b=>b.classList.toggle('on',b.dataset.s===s));scrollTo(0,0)}
function mv(d){cur=new Date(cur.y,cur.m+d,1);cur={y:cur.getFullYear(),m:cur.getMonth()};R()}

function fz(on){document.body.classList.toggle('big',on);localStorage.setItem('esposita_fontsize',on?'large':'normal')}

function R(){$('mes').textContent=MES[cur.m]+' '+cur.y;rIn();rPa();rHor();rT();rCl()}

 const P=pas(K()),meta=rd('esposita_meta_'+K(),0);
 const cob=P.filter(p=>p.estado!=='pendiente').reduce((s,p)=>s+p.valor,0),por=P.reduce((s,p)=>p.estado==='pendiente'?s+p.valor:s,0);
 const pct=meta>0?Math.min(100,Math.round(cob/meta*100)):0,C=2*Math.PI*52;
 const h=now.getHours(),sal=h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';
 const di=(now.getDay()+6)%7,dn=DIAS[di],hor=rd('esposita_horario',{});
 const hoy=HORAS.filter(x=>hor[dn+'_'+x]).map(x=>`<div class="row"><b style="width:44px;color:var(--moss)">${x}</b><span class="grow">${esc(hor[dn+'_'+x])}</span></div>`);
 rd('esposita_tareas',[]).filter(t=>t.dia===dn&&!t.done).forEach(t=>hoy.push(`<div class="row"><b style="width:44px;font-size:11px;color:var(--mut)">Tarea</b><span class="grow">${esc(t.texto)}</span></div>`));
 const deb=Object.entries(pend(P)).sort((a,b)=>b[1]-a[1]);
 const bars=[];for(let i=5;i>=0;i--){const d=new Date(cur.y,cur.m-i,1),k=mk(d.getFullYear(),d.getMonth());bars.push({k,l:MES[d.getMonth()].slice(0,3),v:pas(k).reduce((s,p)=>p.estado!=='pendiente'?s+p.valor:s,0),n:i===0})}
 const mx=Math.max(...bars.map(b=>b.v),1);
 $('s-in').innerHTML=`
 <div class="greet"><b>${sal}</b><span>${dn} ${now.getDate()} de ${MES[now.getMonth()].toLowerCase()}</span></div>
 <div class="hero"><div class="ring"><svg width="128" height="128"><circle class="bg" cx="64" cy="64" r="52"/><circle class="fg" cx="64" cy="64" r="52" stroke-dasharray="${C}" stroke-dashoffset="${C}" id="rg"/></svg><b>${pct}%</b></div>
 <div><small>Cobrado este mes</small><div class="big">${cop(cob)}</div>
 <span class="pill">${meta?(cob>=meta?'Meta lograda':'Faltan '+cop(meta-cob)):'Sin meta aún'}</span></div></div>
 <div class="duo"><div class="r"><div class="v">${cop(por)}</div><small>Por cobrar</small></div><div><div class="v">${P.length}</div><small>Paseos del mes</small></div></div>
 ${deb.length?`<div class="card"><h2>Quién te debe</h2>${deb.map(([n,v])=>`<div class="row">${av(n)}<div class="grow"><b>${esc(n)}</b><small>${cop(v)}</small></div><button class="wa" data-n="${esc(n)}" onclick="cobrar(this.dataset.n)">Cobrar</button></div>`).join('')}</div>`:''}
 <div class="card"><h2>Hoy</h2>${hoy.length?hoy.join(''):'<div class="empty">Nada programado.</div>'}</div>
 <div class="card"><h2>Últimos 6 meses</h2><div class="bars">${bars.map(b=>`<div class="${b.n?'now':''}">${b.v?Math.round(b.v/1000)+'k':''}<i style="height:${Math.max(4,b.v/mx*82)}px"></i>${b.l}</div>`).join('')}</div></div>
 <div class="card"><h2>Meta del mes</h2><div style="display:flex;gap:8px"><input id="mi" type="text" inputmode="numeric" placeholder="$ Meta" value="${meta||''}"><button class="btn" style="width:auto;padding:0 20px" onclick="saveMeta()">Guardar</button></div></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const r=$('rg');if(r)r.style.strokeDashoffset=C*(1-pct/100)}));
}
function saveMeta(){const v=parseFloat($('mi').value.replace(/\D/g,''));if(!v)return toast('Pon una meta válida');wr('esposita_meta_'+K(),v);R();toast('Meta guardada')}

function rPa(){
 $('flt').innerHTML=['todos','pendiente','pagado'].map(f=>`<button class="${flt===f?'on':''}" onclick="flt='${f}';rPa()">${{todos:'Todos',pendiente:'Pendientes',pagado:'Pagados'}[f]}</button>`).join('');
 const q=($('q').value||'').toLowerCase();
 const L=pas(K()).filter(p=>(flt==='todos'||p.estado===flt)&&p.nombre.toLowerCase().includes(q)).sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.id-a.id);
 $('lp').innerHTML=L.length?L.map(p=>{const f=new Date(p.fecha+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});
  return `<div class="row">${av(p.nombre)}<div class="grow"><b>${esc(p.nombre)}</b><small>${f}${p.nota?' · '+esc(p.nota):''}</small></div><div style="text-align:right"><div class="amt">${cop(p.valor)}</div><button class="st ${p.estado}" onclick="tog(${p.id})" aria-label="Cambiar estado">${p.estado==='pagado'?'Pagado':'Pendiente'}</button></div>
  <div style="display:flex"><button class="ib" onclick="dup(${p.id})" aria-label="Repetir paseo"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button><button class="ib" onclick="del(${p.id})" aria-label="Borrar paseo"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div></div>`}).join(''):'<div class="empty">No hay paseos así en este mes.<br>Toca + para registrar el primero.</div>';
}
function tog(id){hap();const k=K(),a=pas(k),p=a.find(x=>x.id===id);if(p){p.estado=p.estado==='pagado'?'pendiente':'pagado';setPas(k,a);R()}}
function del(id){const k=K(),a=pas(k),p=a.find(x=>x.id===id);if(!p)return;setPas(k,a.filter(x=>x.id!==id));R();toast('Paseo borrado','Deshacer',()=>{setPas(k,[...pas(k),p]);R()})}
function dup(id){const p=pas(K()).find(x=>x.id===id);if(p){op();$('rn').value=p.nombre;$('rv').value=p.valor;$('rt').value=p.nota||''}}

function op(){const C=cli(),cnt={};Object.keys(pas(K())).length;Object.keys(C).forEach(n=>cnt[n]=0);pas(K()).forEach(p=>cnt[p.nombre]=(cnt[p.nombre]||0)+1);
 const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,8);
 $('ch').innerHTML=top.map(n=>`<button data-n="${esc(n)}" onclick="pick(this.dataset.n)">${esc(n)}</button>`).join('');
 $('dl').innerHTML=Object.keys(C).map(n=>`<option value="${esc(n)}">`).join('');
 $('rn').value='';$('rv').value='';$('rt').value='';$('rf').value=hoyISO();est('pagado');$('sh').classList.add('on');openSheet()}
const RM=matchMedia('(prefers-reduced-motion:reduce)');let raf,sy=0;
const hap=(n=8)=>{try{!RM.matches&&navigator.vibrate&&navigator.vibrate(n)}catch{}};
function spring(from,to,v,z,resp,fn,done){cancelAnimationFrame(raf);if(RM.matches){fn(to);done&&done();return}
 const w=2*Math.PI/resp,k=w*w,c=2*z*w;let x=from,t0=performance.now();
 const step=t=>{const dt=Math.min(.032,(t-t0)/1e3);t0=t;for(let i=0;i<4;i++){const h=dt/4;v+=(-k*(x-to)-c*v)*h;x+=v*h}
  if(Math.abs(x-to)<.4&&Math.abs(v)<6){fn(to);done&&done();return}fn(x);raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
const pn=()=>$('sh').firstElementChild;
function setY(y){sy=y;pn().style.transform='translate3d(0,'+y+'px,0)';$('sh').style.background='rgba(8,20,40,'+(.5*Math.max(0,1-y/pn().offsetHeight))+')'}
function openSheet(){const h=pn().offsetHeight;setY(h);spring(h,0,0,1,.4,setY)}
function cl(v=0){if(!$('sh').classList.contains('on'))return;spring(sy,pn().offsetHeight,v,1,.35,setY,()=>$('sh').classList.remove('on'))}
const rubber=(o,d,c=.55)=>o*d*c/(d+c*Math.abs(o));
(()=>{const g=$('gh');let grab=0,H=[];
 g.addEventListener('pointerdown',e=>{g.setPointerCapture(e.pointerId);cancelAnimationFrame(raf);grab=e.clientY-sy;H=[{y:e.clientY,t:e.timeStamp}]});
 g.addEventListener('pointermove',e=>{if(!g.hasPointerCapture(e.pointerId))return;let y=e.clientY-grab;if(y<0)y=-rubber(-y,300);setY(y);H.push({y:e.clientY,t:e.timeStamp});H=H.filter(p=>e.timeStamp-p.t<90)});
 const end=e=>{if(!g.hasPointerCapture(e.pointerId))return;const a=H[0],b=H[H.length-1],v=b.t>a.t?(b.y-a.y)/(b.t-a.t)*1e3:0,h=pn().offsetHeight;
  const end=sy+(v/1e3)*.998/(1-.998);if(end>h*.5){hap(6);cl(v)}else spring(sy,0,v,.8,.3,setY)};
 g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end)})();
addEventListener('scroll',()=>document.querySelector('.top').classList.toggle('s',scrollY>4),{passive:true});

function pick(n){$('rn').value=n;const t=cli()[n]?.tarifa;if(t)$('rv').value=t;$('rv').focus()}
function est(s){stt=s;['pagado','pendiente'].forEach(x=>$('e-'+x).classList.toggle('on',x===s))}
function addP(){
 const nombre=$('rn').value.trim().replace(/\s+/g,' '),valor=parseFloat($('rv').value.replace(/\D/g,'')),fecha=$('rf').value;
 if(!nombre||!valor||!fecha)return toast('Falta nombre, valor o fecha');
 const key=fecha.slice(0,7),a=pas(key);a.push({id:Date.now(),nombre,valor,fecha,nota:$('rt').value.trim(),estado:stt});setPas(key,a);
 const C=cli(),ex=Object.keys(C).find(n=>n.toLowerCase()===nombre.toLowerCase());
 if(!ex){C[nombre]={notas:'',tel:'',tarifa:valor}}else if(!C[ex].tarifa)C[ex].tarifa=valor;
 wr('esposita_clientes',C);hap(12);cl();R();toast(key===K()?'Paseo guardado':'Guardado en '+MES[+key.slice(5)-1])}

function rCl(){const C=cli(),P=pend(pas(K())),ns=Object.keys(C).sort((a,b)=>a.localeCompare(b));
 $('lc').innerHTML=ns.length?ns.map(n=>`<div class="card"><div class="row" style="border:0;padding-top:0">${av(n)}<div class="grow"><b>${esc(n)}</b><small>${P[n]?'Debe '+cop(P[n]):'Al día ✓'}</small></div>${P[n]?`<button class="wa" data-n="${esc(n)}" onclick="cobrar(this.dataset.n)">Cobrar</button>`:''}</div>
 <div class="stack" data-n="${esc(n)}"><input data-f="tel" inputmode="tel" placeholder="WhatsApp del dueño" value="${esc(C[n].tel)}"><input data-f="tarifa" inputmode="numeric" placeholder="Tarifa por paseo" value="${esc(C[n].tarifa||'')}"><textarea data-f="notas" placeholder="Alergias, llaves, mañas…">${esc(C[n].notas)}</textarea>
 <button class="btn red" data-n="${esc(n)}" onclick="delC(this.dataset.n)" style="padding:10px;font-size:14px">Quitar cliente</button></div></div>`).join(''):'<div class="empty">Aquí aparecen tus perritos cuando registres el primer paseo.</div>'}
function delC(n){if(!confirm('¿Quitar a '+n+'? Sus paseos no se borran.'))return;const C=cli();delete C[n];wr('esposita_clientes',C);rCl()}
function cobrar(n){const C=cli(),tel=String(C[n]?.tel||'').replace(/\D/g,''),L=pas(K()).filter(p=>p.nombre===n&&p.estado==='pendiente').sort((a,b)=>a.fecha.localeCompare(b.fecha));
 const tot=L.reduce((s,p)=>s+p.valor,0),f=p=>new Date(p.fecha+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});
 const m=`Hola, te hablamos de Trazo Azul 🐾 Te paso el detalle de los paseos de ${n} que están pendientes de pago:\n${L.map(p=>'• '+f(p)+': '+cop(p.valor)).join('\n')}\nTotal: ${cop(tot)}. ¡Gracias!`;
 open('https://wa.me/'+(tel.length===10?'57'+tel:tel)+'?text='+encodeURIComponent(m),'_blank')}

function ag(t){['h','t'].forEach(x=>{$('ag-'+x).classList.toggle('on',x===t);$('a-'+x).style.display=x===t?'':'none'})}
function rHor(){const h=rd('esposita_horario',{});let s='<div class="h"></div>'+DIAS.map(d=>`<div class="h">${d.slice(0,3)}</div>`).join('');
 HORAS.forEach(x=>{s+=`<div class="tm">${x}</div>`+DIAS.map(d=>`<div><textarea data-k="${d}_${x}" aria-label="${d} ${x}">${esc(h[d+'_'+x])}</textarea></div>`).join('')});$('hg').innerHTML=s}
let ht;document.addEventListener('input',e=>{const k=e.target.dataset;if(k.k){clearTimeout(ht);ht=setTimeout(()=>{const h=rd('esposita_horario',{});if(e.target.value.trim())h[k.k]=e.target.value;else delete h[k.k];wr('esposita_horario',h)},400)}
 if(k.f){const n=e.target.closest('[data-n]').dataset.n,C=cli();if(C[n]){C[n][k.f]=e.target.value;wr('esposita_clientes',C)}}});
function rT(){$('td').innerHTML=DIAS.map(d=>`<option ${d===DIAS[(now.getDay()+6)%7]?'selected':''}>${d}</option>`).join('');
 const T=rd('esposita_tareas',[]);$('lt').innerHTML=T.length?DIAS.map(d=>{const L=T.filter(t=>t.dia===d);return L.length?`<div style="color:var(--mut);font-size:12.5px;margin:10px 0 2px">${d}</div>`+L.map(t=>`<div class="chk ${t.done?'d':''}"><input type="checkbox" ${t.done?'checked':''} onchange="chkT(${t.id})"><span class="grow">${esc(t.texto)}</span><button class="ib" onclick="delT(${t.id})" aria-label="Borrar tarea">✕</button></div>`).join(''):''}).join(''):'<div class="empty">Sin tareas por ahora.</div>'}
function addT(){const x=$('tt').value.trim();if(!x)return toast('Escribe la tarea');const T=rd('esposita_tareas',[]);T.push({id:Date.now(),dia:$('td').value,texto:x,done:false});wr('esposita_tareas',T);$('tt').value='';rT();rIn()}
function chkT(id){const T=rd('esposita_tareas',[]),t=T.find(x=>x.id===id);if(t){t.done=!t.done;wr('esposita_tareas',T);rT();rIn()}}
function delT(id){wr('esposita_tareas',rd('esposita_tareas',[]).filter(x=>x.id!==id));rT();rIn()}

function xls(){const P=pas(K());if(!P.length)return toast('No hay paseos este mes');
 const cob=P.filter(p=>p.estado!=='pendiente').reduce((s,p)=>s+p.valor,0),por=P.reduce((s,p)=>p.estado==='pendiente'?s+p.valor:s,0);
 const d=[['Fecha','Perrito','Valor','Estado','Nota'],...P.sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(p=>[p.fecha,p.nombre,p.valor,p.estado,p.nota||''])];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Resumen',K()],['Cobrado',cob],['Por cobrar',por],['Meta',rd('esposita_meta_'+K(),0)]]),'Resumen');
 const w=XLSX.utils.aoa_to_sheet(d);w['!cols']=[{wch:12},{wch:20},{wch:12},{wch:12},{wch:30}];XLSX.utils.book_append_sheet(wb,w,'Paseos');XLSX.writeFile(wb,'Paseos_TrazoAzul_'+K()+'.xlsx')}
function bk(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('esposita_'))o[k]=localStorage.getItem(k)}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='Respaldo_TrazoAzul_'+hoyISO()+'.json';a.click();toast('Respaldo descargado')}
function rs(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;
 const ks=Object.keys(o).filter(k=>k.startsWith('esposita_')&&typeof o[k]==='string');if(!ks.length)throw 0;ks.forEach(k=>{if(!/darkmode|fontsize/.test(k))JSON.parse(o[k])});
 if(!confirm('Esto reemplaza todos los datos de este teléfono por los del archivo. ¿Seguir?'))return;
 Object.keys(localStorage).filter(k=>k.startsWith('esposita_')).forEach(k=>localStorage.removeItem(k));ks.forEach(k=>localStorage.setItem(k,o[k]));location.reload()}catch{toast('Ese archivo no es un respaldo válido')}};r.readAsText(f)}

(()=>{const sd=localStorage.getItem('esposita_darkmode'),d=sd===null?matchMedia('(prefers-color-scheme:dark)').matches:sd==='true',l=localStorage.getItem('esposita_fontsize')==='large';
 $('dk').checked=d;dark(d);$('fz').checked=l;fz(l);R()})();
</script>
